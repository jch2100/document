name: 03-result-report
kind: docx
title: 결과보고서
purpose: 사업·행사·과제 종료 후 결과와 교훈 보고
audience: 팀장·임원·발주처
length: A4 2~5쪽
file: template.docx
outline:
- 개요
- 추진 결과
- 주요 성과
- 목표 대비 실적
- 문제점 및 개선 사항
- 향후 계획
blocks:
  title: 문서 제목
  subtitle: 부제
  meta: 정보표 [[라벨, 값], ...]
  approval: 결재란 [직위, ...]
  summary: 요약 박스 (문자열 또는 목록)
  h1: 대제목 → 자동 '1.'
  h2: 중제목 → 자동 '가.'
  h3: 소제목 → 자동 '1)'
  b: 개조식 목록 → 자동 □ ○ - (중첩 목록 = 하위 단계)
  p: 서술형 문단
  note: ※ 참고
  table: '{header, rows, col_widths, label_col}'
  cover: 표지 {title, subtitle, date, company}
  toc: 목차 필드
  pagebreak: 쪽 나눔
  image: 그림 경로
styles:
  title: Title
  h1: Heading 1
  h2: Heading 2
  h3: Heading 3
  bullet1: 개조식 1
  bullet2: 개조식 2
  bullet3: 개조식 3
  note: 참고
  summary: 요약 박스
  table: 양식대로 표
writing:
  style: gaejosik
  rules:
  - '액션 타이틀: 장 제목 = 그 장의 결론 문장 (제목만 이어 읽어도 이야기가 됨)'
  - 한 장 = 한 메시지. 제목에 '그리고'가 들어가면 장을 나눔
  - '개조식: 명사형·''~함/~임''으로 끝냄, ''~습니다'' 금지(마무리 장 제외)'
  - 한 항목 = 한 주장, 한 줄 40자 안팎
  - '숫자는 단위와 함께 (예: 1,200만 원, 15%p)'
  - 날짜는 '2026. 11. 4.' 형식
  - 기호·번호는 직접 쓰지 않음 (양식이 자동으로 붙임)
  - 서술형 문단(p)은 제안서·품의 문구에만
  banned:
  - 혁신적인
  - 획기적인
  - 다양한
  - ~하는 것이 중요합니다
  - ~라고 할 수 있습니다
  - —
  - 이모지
check:
  fail_on:
  - missing_korean_font
  - direct_symbol
  warn_on:
  - ai_tone
  - ending_style
  - direct_format
  - empty_paragraphs
