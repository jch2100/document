# AI가 쓴 티가 나는 표현. 회사 사정에 맞게 추가·삭제하세요.
# level: warn(경고) | fail(실패) | info(참고)
id: ai_tone
patterns:
  - re: "—"
    msg: "엠대시(—)는 한국어 보고서에서 어색함"
    fix: "쉼표·괄호·줄바꿈으로 바꾸기"
  - re: "[\U0001F300-\U0001FAFF☀-➿]"
    msg: "이모지"
    fix: "삭제"
  - re: "(?:혁신적|획기적|탁월한|압도적)"
    msg: "근거 없는 과장 수식어"
    fix: "숫자나 사실로 바꾸기 (예: '처리 시간 40% 단축')"
  - re: "다양한"
    msg: "'다양한'은 내용이 없다는 신호"
    fix: "구체적으로 무엇인지 나열"
  - re: "(?:하는 것이 중요합니다|하는 것이 중요함|라고 할 수 있습니다|할 수 있을 것입니다)"
    msg: "번역투·완곡 표현"
    fix: "단정형으로 (예: '~해야 함', '~임')"
  - re: "(?:에 있어서|에 있어|를 통해서?|으로 인해)"
    msg: "번역투 조사 (~에 있어서, ~를 통해)"
    fix: "'~에서', '~로', '~때문에'로 줄이기"
    level: info
  - re: "(?:여러분|함께 알아보|살펴보겠습니다|알아보겠습니다)"
    msg: "강의·블로그 말투"
    fix: "보고서 문체로"
  - re: "(?:시너지|패러다임|인사이트를 도출|가치를 창출)"
    msg: "상투어"
    fix: "구체적 결과로"
    level: info
  - re: "\\*\\*|##|^\\s*[-*]\\s"
    msg: "마크다운 기호가 그대로 남음"
    fix: "삭제"
