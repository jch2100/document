# 개조식 문체 규칙. □ ○ - 기호 순서는 '회사 관습'이지 법이 아니므로 profile.yaml의 writing.symbols로 바꿀 수 있음.
id: gaejosik
# 개조식 항목(목록·본문 플레이스홀더)에서 경고할 종결
bad_endings:
  - re: "(?:습니다|합니다|입니다|됩니다|십시오)\\.?$"
    msg: "개조식 항목이 '~습니다'로 끝남"
    fix: "'~함', '~임', '~예정', 명사형으로 (예: '추진하였습니다' → '추진함')"
  - re: "(?:해요|예요|이에요|어요|아요)\\.?$"
    msg: "구어체 종결"
    fix: "'~함/~임'으로"
  - re: "[^.]다\\.$"
    msg: "평서형 '~다.' 종결"
    fix: "개조식은 '~함/~임' 또는 명사형. 서술형 문단이면 문단(p) 블록 사용"
    level: info
# 한 항목 권장 최대 길이(글자)
max_item_chars: 80
# 수동으로 입력된 기호 (Word에서는 스타일 번호매기기를 써야 편집이 쉬움)
manual_symbols: "^\\s*(?:[□■○●◦◎▪▶※•·]|-\\s|\\d{1,2}[.)]\\s|[가나다라마바사아자차카타파하][.)]\\s|[①-⑳])"
# 이 종결은 허용 (마무리·인사 슬라이드, 품의 문구)
allow_layouts: ["마무리", "표지"]
allow_phrases: ["바랍니다", "감사합니다", "부탁드립니다"]
