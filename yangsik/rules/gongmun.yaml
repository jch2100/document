# 공문서 작성 편람(행정안전부) 기반 표기 규칙 중 자동 검사 가능한 것.
# 민간 회사에도 대체로 통용되는 것만 기본 warn, 나머지는 info.
id: gongmun
patterns:
  - re: "\\b20\\d{2}[./-]\\s?\\d{1,2}[./-]\\s?\\d{1,2}(?!\\.)\\b"
    msg: "날짜 표기 (편람: '2026. 11. 4.' — 연·월·일 뒤 마침표, 사이 한 칸)"
    fix: "2026. 11. 4."
    exclude_re: "20\\d{2}\\. \\d{1,2}\\. \\d{1,2}\\."
    level: info
  - re: "붙임\\s*:"
    msg: "'붙임' 뒤 쌍점(:) 생략이 편람 표기"
    fix: "'붙임  ○○ 1부.'"
    level: info
  - re: "[⑴-⒇]|[㈀-㈍]"
    msg: "한 글자짜리 괄호 숫자/한글 문자(⑴, ㈎)는 글꼴에 따라 깨짐"
    fix: "(1), (가)처럼 괄호와 글자를 따로 입력"
  - re: "\\d+\\s?%\\s?포인트"
    msg: "'%포인트'는 '%p'로 통일 권장"
    fix: "%p"
    level: info
